<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Меню The Chicken</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* Layout: brand header, sticky category chips, one-column list on phones, two columns on wide screens. */
:root{--bg:#fbf8ee;--card:#ffffff;--fg:#1d211e;--muted:rgba(29,33,30,.62);--line:rgba(29,33,30,.12);--green:#1a7a3c;--green-d:#0f4a24;--yellow:#f7c61b;--ring:#fff0a6;--pricefg:#1a7a3c;--chipbg:#ffffff;--shadow:0 2px 10px rgba(29,33,30,.10);--red:#e23b2e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f2417;--card:#173524;--fg:#f4f1e4;--muted:rgba(244,241,228,.66);--line:rgba(244,241,228,.14);--green:#5ed089;--ring:#f7c61b;--pricefg:#0f4a24;--chipbg:#173524;--shadow:0 2px 10px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f2417;--card:#173524;--fg:#f4f1e4;--muted:rgba(244,241,228,.66);--line:rgba(244,241,228,.14);--green:#5ed089;--ring:#f7c61b;--pricefg:#0f4a24;--chipbg:#173524;--shadow:0 2px 10px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Golos Text',system-ui,sans-serif;font-size:16px;line-height:1.35;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:980px;margin:0 auto}
header{padding:22px 0 10px;text-align:center}
.brand{display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.brand .the{font-weight:900;font-size:clamp(34px,9vw,64px);line-height:1;color:var(--yellow);-webkit-text-stroke:3px #1d211e;paint-order:stroke fill;letter-spacing:-.02em}
.brand .ch{font-weight:900;font-size:clamp(38px,9.8vw,70px);line-height:1;color:var(--green);-webkit-text-stroke:3px #1d211e;paint-order:stroke fill;letter-spacing:-.02em}
.brand img{height:clamp(46px,11vw,84px);width:auto}
.slogan{margin:10px 0 0;font-weight:800;font-size:clamp(15px,4.3vw,22px)}
.slogan span{display:block;font-weight:600;font-size:clamp(13px,3.6vw,16px);color:var(--muted);margin-top:2px}
.slogan svg{display:inline-block;width:20px;height:18px;vertical-align:-3px;margin-left:5px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);margin:0 -16px;padding:8px 16px;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line)}
.chips{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none;padding:2px 0}
.chips::-webkit-scrollbar{display:none}
.chips a{flex:0 0 auto;text-decoration:none;color:var(--fg);background:var(--chipbg);border:1.5px solid var(--line);border-radius:20px;padding:7px 14px;font-weight:700;font-size:14px}
.chips a:focus-visible,.lang button:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.lang{display:flex;flex:0 0 auto;border:1.5px solid var(--green);border-radius:20px;overflow:hidden}
.lang button{border:0;background:transparent;color:var(--green);font:inherit;font-weight:800;font-size:13px;padding:7px 11px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--green);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lang button[aria-pressed="true"]{color:#0f2417}}
:root[data-theme="dark"] .lang button[aria-pressed="true"]{color:#0f2417}
section{padding-top:26px;scroll-margin-top:64px}
.hd{display:flex;align-items:center;gap:12px;margin:0 0 12px}
.hd h2{margin:0;display:inline-block;background:var(--yellow);color:#1d211e;font-weight:800;font-size:clamp(17px,4.6vw,22px);text-transform:uppercase;letter-spacing:.01em;padding:7px 22px 8px 16px;clip-path:polygon(0 22%,2% 0,40% 5%,97% 0,100% 38%,98% 66%,100% 100%,60% 93%,3% 100%,0 62%)}
.hd h2 small{display:block;font-size:.62em;font-weight:700;opacity:.78;text-transform:none;letter-spacing:0}
.hd img{height:54px;width:auto;max-width:38%;object-fit:contain;margin-left:auto;flex:0 1 auto;min-width:0}
.list{display:grid;gap:0 28px;grid-template-columns:minmax(0,1fr)}
@media (min-width:760px){.list{grid-template-columns:repeat(2,minmax(0,1fr))}.list.one{grid-template-columns:minmax(0,1fr)}}
.it{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);min-width:0}
.it .t{min-width:0}
.it .n{font-weight:700;font-size:16px}
.it .s{font-size:13px;color:var(--muted);margin-top:1px}
.pr{flex:0 0 auto;font-weight:800;font-size:18px;line-height:1.1;color:var(--pricefg);background:var(--ring);box-shadow:0 0 0 3px var(--yellow);border-radius:13px;padding:2px 11px;margin-right:4px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pizzas{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media (min-width:760px){.pizzas{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pz{display:grid;grid-template-columns:92px 1fr;gap:12px;align-items:center;background:var(--card);border-radius:16px;padding:10px 12px 10px 10px;box-shadow:var(--shadow);min-width:0}
.pz img{width:92px;height:92px;object-fit:contain}
.pz .ph{width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#f2d8a4,#d99a52);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#6b3f12;text-align:center;padding:8px}
.pz .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pz .n{font-weight:800;font-size:17px}
.pz p{margin:3px 0 0;font-size:12.5px;color:var(--muted);line-height:1.3}
.pz p b{display:block;font-weight:600;opacity:.85;margin-top:2px}
.cards{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:760px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}
.cd{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.cd h3{margin:0;font-weight:900;font-size:26px;text-transform:uppercase;color:var(--green);letter-spacing:.02em}
.cd .pics{display:flex;align-items:flex-end;justify-content:center;gap:6px;background:radial-gradient(circle at 50% 40%,var(--bg),transparent 75%);border-radius:12px;padding:6px 4px;min-height:84px}
.cd .pics img{height:76px;width:auto;min-width:0;flex:0 1 auto;max-width:22%;object-fit:contain}
.cd ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.cd li{font-weight:700;font-size:15px}
.cd li small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.cd .pill{align-self:flex-start;margin-top:auto;font-weight:900;font-size:26px;color:#1d211e;background:var(--yellow);border-radius:30px;padding:6px 20px}
.note{margin:14px 0 0;font-size:13px;color:var(--muted)}
footer{margin-top:34px;padding:18px 0 0;border-top:2px solid var(--line);text-align:center;font-size:14px;color:var(--muted)}
footer b{display:block;color:var(--fg);font-size:16px}
footer a{color:var(--green);font-weight:700}
</style>
</head>
<body>

<div class="wrap">
<header>
  <div class="brand"><span class="the">THE</span><img id="logo" alt="" width="84" height="74"><span class="ch">Chicken</span></div>
  <p class="slogan">Бүкіл отбасымен — The Chicken-ге!<svg viewBox="0 0 24 22" aria-hidden="true"><path d="M12 21C5 15 1 11.500 1 7a5.500 5.500 0 0 1 11-1.500A5.500 5.500 0 0 1 23 7c0 4.500-4 8-11 14z" fill="#f7c61b" stroke="#1d211e" stroke-width="1.600" stroke-linejoin="round"/></svg><span>Всей семьёй — к The Chicken!</span></p>
</header>
<nav class="bar" aria-label="Разделы меню">

var menu=document.getElementById('menu'),chips=document.getElementById('chips');
function two(ru,kz){var a=lang==='ru'?ru:kz,b=lang==='ru'?kz:ru;return [a,(b&&b!==a)?b:'']}
function priceText(p){return esc(p)+' ₸'}
function render(){
  var h='',c='';
  S.forEach(function(s){
    var t=two(s.ru,s.kz);
    c+='<a href="#'+s.id+'">'+esc(t[0])+'</a>';
    h+='<section id="'+s.id+'"><div class="hd"><h2>'+esc(t[0])+(t[1]?'<small>'+esc(t[1])+'</small>':'')+'</h2>'+(s.img?'<img src="'+IMG[s.img]+'" alt="">':'')+'</div>';
    if(s.kind==='cards'){
      h+='<div class="cards">';
      s.cards.forEach(function(d){
        h+='<div class="cd"><h3>'+esc(d.n)+'</h3><div class="pics">'+d.pics.map(function(k){return '<img src="'+IMG[k]+'" alt="">'}).join('')+'</div><ul>'+d.ls.map(function(l){var x=two(l[0],l[1]);return '<li>'+esc(x[0])+(l[2]?' · '+esc(l[2]):'')+(x[1]?'<small>'+esc(x[1])+'</small>':'')+'</li>'}).join('')+'</ul><div class="pill">'+priceText(d.p)+'</div></div>';
      });
      h+='</div>';
      if(s.id==='sets')h+='<p class="note">'+(lang==='ru'?'Дип — сырный или кетчуп.':'Дип — ірімшікті немесе кетчуп.')+'</p>';
    }else if(s.kind==='pizza'){
      h+='<div class="pizzas">';
      s.items.forEach(function(i){
        var t2=two(i[0],i[1]),d=lang==='ru'?[i[3],i[4]]:[i[4],i[3]];
        h+='<div class="pz">'+(i[5]?'<img src="'+IMG[i[5]]+'" alt="">':'<div class="ph">'+esc(i[0])+'</div>')+'<div style="min-width:0"><div class="row"><span class="n">'+esc(t2[0])+'</span><span class="pr">'+priceText(i[2])+'</span></div>'+(t2[1]&&t2[1]!==t2[0]?'<div class="s" style="font-size:12.5px;color:var(--muted)">'+esc(t2[1])+'</div>':'')+'<p>'+esc(d[0])+'<b>'+esc(d[1])+'</b></p></div></div>';
      });
      h+='</div>';
    }else{
      h+='<div class="list'+(s.kind==='list one'?' one':'')+'">';
      s.items.forEach(function(i){
        var t2=two(i[0],i[1]),sub=t2[1];
        if(i[3]){ sub=(lang==='ru'?i[3]:i[1]); t2=[lang==='ru'?i[0]:i[0],''] ; if(lang!=='ru'){sub=i[1]} }
        h+='<div class="it"><div class="t"><div class="n">'+esc(i[3]?i[0]:t2[0])+'</div>'+(i[3]?'<div class="s">'+esc(lang==='ru'?i[3]:i[1])+'</div><div class="s">'+esc(lang==='ru'?i[1]:i[3])+'</div>':(sub?'<div class="s">'+esc(sub)+'</div>':''))+'</div><span class="pr">'+priceText(i[2])+'</span></div>';
      });
      h+='</div>';
    }
    h+='</section>';
  });
  menu.innerHTML=h;chips.innerHTML=c;
  document.getElementById('svc').textContent=lang==='ru'?'Обслуживание 10%':'Қызмет көрсету 10%';
  document.getElementById('svc2').textContent=lang==='ru'?'Қызмет көрсету 10%':'Обслуживание 10%';
  document.documentElement.lang=lang==='ru'?'ru':'kk';
  document.getElementById('b-ru').setAttribute('aria-pressed',lang==='ru');
  document.getElementById('b-kz').setAttribute('aria-pressed',lang==='kz');
}
document.getElementById('logo').src=IMG.logo;
document.getElementById('b-ru').onclick=function(){lang='ru';try{localStorage.setItem('chicken-lang','ru')}catch(e){}render()};
document.getElementById('b-kz').onclick=function(){lang='kz';try{localStorage.setItem('chicken-lang','kz')}catch(e){}render()};
if(lang!=='kz')lang='ru';
render();
</script>
